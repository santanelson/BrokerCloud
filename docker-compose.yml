services:
  db:
    image: postgres:15-alpine
    container_name: brokercloud_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-brokercloud}
      POSTGRES_PASSWORD: ${DB_PASS:-brokercloud_pass}
      POSTGRES_DB: ${DB_NAME:-brokercloud}
    volumes:
      - brokercloud_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    container_name: brokercloud_redis
    restart: always
    volumes:
      - brokercloud_redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  api:
    build: 
      context: ./api
    container_name: brokercloud_api
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - ./api/.env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-brokercloud}:${DB_PASS:-brokercloud_pass}@db:5432/${DB_NAME:-brokercloud}?schema=public
      - REDIS_URL=redis://redis:6379
      # O API_PUBLIC_URL deve estar configurado no seu ./api/.env apontando para o seu domínio (ex: https://api.selectahome.com.br)
    ports:
      - "${API_PORT:-3001}:3001"

  web:
    build:
      context: ./web
      args:
        # As variáveis de build precisam ser passadas no momento da criação da imagem
        # Se elas existirem no ambiente da VPS, serão puxadas
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:?Defina NEXT_PUBLIC_API_URL no .env da raiz antes do build}
        - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL:?Defina NEXT_PUBLIC_SOCKET_URL no .env da raiz antes do build}
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:?Defina NEXT_PUBLIC_SUPABASE_URL no .env da raiz antes do build}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Defina NEXT_PUBLIC_SUPABASE_ANON_KEY no .env da raiz antes do build}
    container_name: brokercloud_web
    restart: always
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:?Defina NEXT_PUBLIC_API_URL no .env da raiz antes do build}
      - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL:?Defina NEXT_PUBLIC_SOCKET_URL no .env da raiz antes do build}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:?Defina NEXT_PUBLIC_SUPABASE_URL no .env da raiz antes do build}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Defina NEXT_PUBLIC_SUPABASE_ANON_KEY no .env da raiz antes do build}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  brokercloud_db_data:
  brokercloud_redis_data:
